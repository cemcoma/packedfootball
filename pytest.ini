[pytest]
testpaths = tests
# tests/ is added to sys.path so `from conftest import ...` resolves, matching
# how packedfootball/'s own modules import each other as top-level names.
pythonpath = tests
addopts = -q --strict-markers
# --strict-markers means every marker used has to be declared here.
markers =
    slow: simulates one or more full matches (seconds, not milliseconds). Excluded by `make test-fast`.
filterwarnings =
    ignore::DeprecationWarning
